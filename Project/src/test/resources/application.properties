server.port=8081
spring.application.name=PhotoApp
# Use in-memory database for local test execution to avoid OS permission issues
spring.datasource.url=jdbc:h2:mem:photodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
logging.level.hr.algebra.project=INFO
# Use target folder for temporary test file uploads
upload.dir=target/test-uploads
management.endpoints.web.exposure.include=health,metrics,prometheus
